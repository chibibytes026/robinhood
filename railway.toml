# Railway config for the nightly news-ingestion cron.
#
# One cron service runs one command. This service pulls news into Supabase
# `market_news` every night so the bots have fresh headlines to call upon in the
# morning. The sim+streak and reports crons are SEPARATE Railway services pointing
# at this same repo, each with its own startCommand + cronSchedule.
#
# Required env vars (set in the Railway service, never committed):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, FINNHUB_API_KEY
# Optional: NEWS_TIMESPAN (default 24H), NEWS_LOOKBACK_DAYS (default 1)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m ingest.news"
# 06:00 UTC nightly (~1-2am ET) — after the US close and the overnight news cycle.
cronSchedule = "0 6 * * *"
# Cron job: run once and exit; do not restart on completion.
restartPolicyType = "NEVER"

# Railway config for the nightly Finnhub-ingestion cron.
#
# One cron service runs one command: `ingest.daily`, which pulls prices + news +
# insider + 13F into Supabase every night so the bots have fresh data to call upon
# in the morning. The Reddit/Hikikomori, sim+streak, and reports crons are SEPARATE
# Railway services pointing at this same repo, each with its own startCommand +
# cronSchedule. Reddit uses its own config file `railway.reddit.toml` (set that as
# the service's "Config as Code" path) so it runs ingest.reddit_sentiment, not this.
#
# Required env vars (set in the Railway service, never committed):
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, FINNHUB_API_KEY
# Optional: NEWS_LOOKBACK_DAYS (default 1), NEWS_RETENTION_DAYS (default 90)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m ingest.daily"
# Cron schedule is managed in the Railway service config (set via API / dashboard):
#   0 6 * * *   — 06:00 UTC nightly (~1-2am ET), after the US close + overnight news.
# Deliberately NOT set here: a config-file cron overrides dashboard changes on every
# deploy, which blocks one-off manual runs. Keep the schedule in the service config.
# Cron job: run once and exit; do not restart on completion.
restartPolicyType = "NEVER"

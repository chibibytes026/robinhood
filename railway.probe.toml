# Throwaway Railway config for the ONE-OFF NANC-holdings probe.
#
# Used only to run `scripts/probe_nanc_holdings.py` from Railway's (open) egress —
# the agent session is egress-locked and can't reach Yahoo/SEC/the issuer. Point a
# temporary service's "Config as Code" path at this file, deploy once, read the logs,
# then delete the service. Needs NO env vars (pure read-only HTTP, no Supabase).
#
# Not wired into any cron. Safe to delete once the probe has told us what NANC
# holdings source is grabbable headless.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m scripts.probe_nanc_holdings"
restartPolicyType = "NEVER"
